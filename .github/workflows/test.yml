name: NixOS integration tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        test: [wifi-autoconnect, tailscale-ssh]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - name: Run VM integration test
        run: nix build -L --show-trace .#checks.x86_64-linux.${{ matrix.test }}
      - name: Preserve test report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.test }}
          path: result/
